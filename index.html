<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Classement Jeux">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Classement Jeux</title>
  <style>
    :root {
      --violet: #6d28d9;
      --bord: #e4e4e7;
      --texte: #18181b;
      --muted: #71717a;
      --fond: #fafafa;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      color: var(--texte);
      background: var(--fond);
    }

    h1 { font-size: 22px; margin: 0 0 4px; }
    .sous-titre { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
    h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin: 18px 0 8px;
    }

    .carte {
      background: #fff;
      border: 1px solid var(--bord);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    label, .etiquette {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin: 10px 0 4px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--bord);
      border-radius: 8px;
      background: #fff;
      color: var(--texte);
    }

    select:focus, input:focus { outline: 2px solid rgba(109, 40, 217, .25); border-color: var(--violet); }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--bord);
      border-radius: 10px;
      background: #fff;
      color: var(--texte);
      cursor: pointer;
    }

    button.principal {
      background: var(--violet);
      border-color: var(--violet);
      color: #fff;
      font-weight: 600;
    }

    button.danger { color: #b91c1c; }
    button:disabled { opacity: .5; }

    button.toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0;
      padding: 4px 0;
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 16px;
    }

    .fleche { color: var(--muted); transition: transform .15s ease; transform: rotate(-90deg); }
    .ouvert .fleche { transform: rotate(0deg); }

    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f4f4f5;
    }

    .player-item:last-child { border-bottom: none; }

    .player-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--violet);
    }

    .player-name { flex: 1; cursor: pointer; }

    .teamSelect {
      width: auto;
      flex: 0 0 auto;
      padding: 6px 8px;
      font-size: 14px;
    }

    .ligne {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #f4f4f5;
    }

    .ligne:last-child { border-bottom: none; }
    .ligne select { width: auto; min-width: 76px; }
    .ligne .rang-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .radio { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 16px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--texte); }
    .radio input { width: 20px; height: 20px; accent-color: var(--violet); }

    .petits-boutons { display: flex; gap: 6px; flex: 0 0 auto; }
    .petits-boutons button { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; border-radius: 8px; }

    .meta { font-size: 12px; color: var(--muted); }
    .vide { font-size: 14px; color: var(--muted); margin: 8px 0; }
    .statut { min-height: 20px; margin: 8px 0 0; font-size: 14px; font-weight: 600; color: #15803d; }

    .rang { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f4f4f5; }
    .rang:last-child { border-bottom: none; }
    .rang-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pastille {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #f4f4f5;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .pastille.premier { background: var(--violet); color: #fff; }
    .score { font-weight: 700; font-variant-numeric: tabular-nums; }
    .partie { padding: 8px 0; border-bottom: 1px solid #f4f4f5; }
    .partie:last-child { border-bottom: none; }
    .partie p { margin: 2px 0 0; }

    .champ-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 380px) { .champ-duo { grid-template-columns: 1fr; } }

    .hidden { display: none !important; }
  </style>

<body>

<h1>Classement Jeux</h1>
<p class="sous-titre">Soirées jeux de société entre amis · classement Elo</p>

<!-- ================= NOUVELLE PARTIE ================= -->
<div class="carte">
  <h3 style="margin-top:0">Nouvelle partie</h3>

  <label for="jeu">Jeu</label>
  <select id="jeu" onchange="onJeuChange()"></select>

  <div id="modeContainer" class="hidden">
    <label for="mode">Mode</label>
    <select id="mode" onchange="updateClassementInputs()">
      <option value="competitif">Compétitif</option>
      <option value="coop">Coop</option>
    </select>
  </div>

  <div id="teamModeContainer" class="hidden">
    <label for="teamModeSelect">Jouer en équipe</label>
    <select id="teamModeSelect" onchange="onTeamModeChange()">
      <option value="non">Non</option>
      <option value="oui">Oui</option>
    </select>
  </div>

  <div id="teamCountContainer" class="hidden">
    <label for="teamCount">Nombre d'équipes</label>
    <select id="teamCount" onchange="updateClassementInputs()">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <div id="coopDifficultyContainer" class="hidden">
    <label for="coopDifficulty">Difficulté</label>
    <select id="coopDifficulty">
      <option value="0.8">Facile</option>
      <option value="1">Moyen</option>
      <option value="1.2">Difficile</option>
    </select>
  </div>

  <h3>Joueurs</h3>
  <div id="joueursList"></div>

  <h3>Classement de la partie</h3>
  <div id="classementInputs"></div>

  <button class="principal" onclick="validerPartie()">Valider la partie</button>
  <p id="statut" class="statut"></p>
</div>

<!-- ================= CLASSEMENT ================= -->
<div class="carte">
  <button class="toggle" onclick="toggle('blocClassement', this)">
    <span>Classement actuel</span><span class="fleche">&#9662;</span>
  </button>
  <div id="blocClassement" class="hidden" style="margin-top:10px">
    <div id="classement"></div>
  </div>
</div>

<!-- ================= HISTORIQUE ================= -->
<div class="carte">
  <button class="toggle" onclick="toggle('blocHistorique', this)">
    <span>Historique</span><span class="fleche">&#9662;</span>
  </button>
  <div id="blocHistorique" class="hidden" style="margin-top:10px">
    <div id="historique"></div>
  </div>
</div>

<!-- ================= JOUEURS ================= -->
<div class="carte">
  <button class="toggle" onclick="toggle('blocJoueurs', this)">
    <span>Gestion des joueurs</span><span class="fleche">&#9662;</span>
  </button>
  <div id="blocJoueurs" class="hidden" style="margin-top:10px">
    <div id="gestionJoueurs"></div>
    <label for="newPlayer">Ajouter un joueur</label>
    <input id="newPlayer" type="text" placeholder="Nom" onkeydown="if (event.key === 'Enter') ajouterJoueur()">
    <button onclick="ajouterJoueur()">Ajouter</button>
  </div>
</div>

<!-- ================= JEUX ================= -->
<div class="carte">
  <button class="toggle" onclick="toggle('blocJeux', this)">
    <span>Gestion des jeux</span><span class="fleche">&#9662;</span>
  </button>
  <div id="blocJeux" class="hidden" style="margin-top:10px">
    <div id="gestionJeux"></div>

    <p id="titreFormJeu" class="etiquette" style="margin-top:16px">Ajouter un jeu</p>

    <label for="newGameName">Nom</label>
    <input id="newGameName" type="text" placeholder="Nom du jeu">

    <div class="champ-duo">
      <div>
        <label for="newGameComplexity">Complexité (1 à 5)</label>
        <input id="newGameComplexity" type="number" step="0.1" min="1" max="5" value="2.5" inputmode="decimal">
      </div>
      <div>
        <label for="newGameDuration">Durée (minutes)</label>
        <input id="newGameDuration" type="number" step="5" min="1" value="45" inputmode="numeric">
      </div>
    </div>

    <label for="newGameMode">Mode</label>
    <select id="newGameMode" onchange="onModeChangeNewGame()">
      <option value="competitif">Compétitif</option>
      <option value="coop">Coop</option>
      <option value="mixte">Mixte</option>
    </select>

    <div id="victoryTypeContainer">
      <label for="newGameVictoryType">Victoire (compétitif)</label>
      <select id="newGameVictoryType">
        <option value="classement">Classement</option>
        <option value="binaire">Victoire / Défaite</option>
      </select>
    </div>

    <label for="newGameVariableDuration">Durée variable</label>
    <select id="newGameVariableDuration">
      <option value="non">Non</option>
      <option value="oui">Oui</option>
    </select>

    <label for="newGameTeamMode">Équipes</label>
    <select id="newGameTeamMode">
      <option value="non">Jamais</option>
      <option value="oui">Toujours</option>
      <option value="variable">Variable</option>
    </select>

    <button class="principal" id="btnEnregistrerJeu" onclick="enregistrerJeu()">Ajouter le jeu</button>
    <button id="btnAnnulerJeu" class="hidden" onclick="annulerEditionJeu()">Annuler la modification</button>
  </div>
</div>

<!-- ================= DONNÉES ================= -->
<div class="carte">
  <button class="toggle" onclick="toggle('blocDonnees', this)">
    <span>Données</span><span class="fleche">&#9662;</span>
  </button>
  <div id="blocDonnees" class="hidden" style="margin-top:10px">
    <button onclick="exporterDonnees()">Exporter (JSON)</button>
    <input type="file" id="importFile" accept="application/json" onchange="importerDonnees(event)" class="hidden">
    <button onclick="document.getElementById('importFile').click()">Importer</button>
    <button class="danger" onclick="reset()">Tout réinitialiser</button>
  </div>
</div>

<script>
/* ============================================================
   CONSTANTES
============================================================ */
var START_SCORE = 500;
var K_FACTOR = 40;
var COOP_CAP = 20;
var REGRESSION_RATE = 0.02;

/* ============================================================
   ÉTAT
============================================================ */
var jeux = lire("jeux", {});
var joueurs = lire("joueurs", {});
var historique = lire("historique", []);
var coopGains = {};
var selection = {};
var equipes = {};
var positionsJoueurs = {};
var positionsEquipes = {};
var jeuEnEdition = null;
var minuteurStatut = null;

/* ============================================================
   STOCKAGE + OUTILS
============================================================ */
function lire(cle, defaut) {
  try {
    var brut = localStorage.getItem(cle);
    return brut ? JSON.parse(brut) : defaut;
  } catch (erreur) {
    return defaut;
  }
}

function ecrire(cle, valeur) {
  try {
    localStorage.setItem(cle, JSON.stringify(valeur));
  } catch (erreur) {
    /* quota plein : on garde les données en mémoire */
  }
}

function sauverTout() {
  ecrire("jeux", jeux);
  ecrire("joueurs", joueurs);
  ecrire("historique", historique);
}

function echapper(valeur) {
  return String(valeur == null ? "" : valeur).replace(/[&<>"']/g, function (caractere) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[caractere];
  });
}

function afficherStatut(message) {
  var zone = document.getElementById("statut");
  if (!zone) return;
  zone.textContent = message;
  if (minuteurStatut) clearTimeout(minuteurStatut);
  minuteurStatut = setTimeout(function () { zone.textContent = ""; }, 5000);
}

function toggle(id, bouton) {
  var bloc = document.getElementById(id);
  if (!bloc) return;
  bloc.classList.toggle("hidden");
  if (bouton) bouton.classList.toggle("ouvert", !bloc.classList.contains("hidden"));
}

/* ============================================================
   LECTURE DU JEU / MODE SÉLECTIONNÉ
============================================================ */
function nomJeuActif() {
  var select = document.getElementById("jeu");
  return select ? select.value : "";
}

function jeuActif() {
  return jeux[nomJeuActif()] || null;
}

function modeReel() {
  var jeu = jeuActif();
  if (!jeu) return "competitif";
  if (jeu.mode === "mixte") {
    var select = document.getElementById("mode");
    return select ? select.value : "competitif";
  }
  return jeu.mode;
}

function equipeActive(jeu) {
  if (!jeu) return "non";
  if (jeu.modeEquipe === "variable") {
    var select = document.getElementById("teamModeSelect");
    return select ? select.value : "non";
  }
  return jeu.modeEquipe || "non";
}

function nombreEquipes() {
  var select = document.getElementById("teamCount");
  if (!select) return 2;
  var valeur = parseInt(select.value, 10);
  return valeur >= 2 && valeur <= 4 ? valeur : 2;
}

function joueursChoisis() {
  return Object.keys(joueurs).filter(function (nom) {
    return selection[nom] === true;
  });
}

/* ============================================================
   AFFICHAGES
============================================================ */
function renderJeuSelect() {
  var select = document.getElementById("jeu");
  var noms = Object.keys(jeux).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  var precedent = select.value;
  if (noms.length === 0) {
    select.innerHTML = '<option value="">— aucun jeu —</option>';
    return;
  }
  select.innerHTML = noms.map(function (nom) {
    return '<option value="' + echapper(nom) + '">' + echapper(nom) + "</option>";
  }).join("");
  if (noms.indexOf(precedent) !== -1) select.value = precedent;
}

function optionsEquipes(selectionnee) {
  var total = nombreEquipes();
  var html = "";
  for (var i = 1; i <= total; i++) {
    html += '<option value="' + i + '"' + (i === selectionnee ? " selected" : "") + ">Équipe " + i + "</option>";
  }
  return html;
}

function renderJoueurs() {
  var conteneur = document.getElementById("joueursList");
  var jeu = jeuActif();
  var enEquipe = equipeActive(jeu) === "oui";
  var noms = Object.keys(joueurs).sort(function (a, b) { return a.localeCompare(b, "fr"); });

  if (noms.length === 0) {
    conteneur.innerHTML = '<p class="vide">Aucun joueur : ajoute-les dans « Gestion des joueurs ».</p>';
    return;
  }

  conteneur.innerHTML = noms.map(function (nom) {
    var coche = selection[nom] === true;
    var equipe = parseInt(equipes[nom], 10) || 1;
    return '<div class="player-item">' +
      '<input type="checkbox" data-cocher="' + echapper(nom) + '"' + (coche ? " checked" : "") + ">" +
      '<span class="player-name" data-cocher="' + echapper(nom) + '">' + echapper(nom) + "</span>" +
      (enEquipe && coche
        ? '<select class="teamSelect" data-equipe="' + echapper(nom) + '">' + optionsEquipes(equipe) + "</select>"
        : "") +
      "</div>";
  }).join("");
}

function optionsNombres(total, selectionnee) {
  var html = "";
  for (var i = 1; i <= total; i++) {
    html += '<option value="' + i + '"' + (i === selectionnee ? " selected" : "") + ">" + i + "</option>";
  }
  return html;
}

function updateClassementInputs() {
  var zone = document.getElementById("classementInputs");
  var zoneDifficulte = document.getElementById("coopDifficultyContainer");
  var jeu = jeuActif();

  if (!jeu) {
    zone.innerHTML = "";
    zoneDifficulte.classList.add("hidden");
    return;
  }

  var enEquipe = equipeActive(jeu) === "oui";
  var mode = modeReel();
  zoneDifficulte.classList.toggle("hidden", enEquipe || mode !== "coop");

  var choisis = joueursChoisis();

  if (choisis.length === 0) {
    zone.innerHTML = '<p class="vide">Coche au moins un joueur pour saisir le résultat.</p>';
    return;
  }

  if (enEquipe) {
    var total = nombreEquipes();
    choisis.forEach(function (nom) {
      var equipe = parseInt(equipes[nom], 10) || 1;
      equipes[nom] = equipe > total ? 1 : equipe;
    });
    var htmlEquipes = '<p class="etiquette">Classement des équipes</p>';
    for (var t = 1; t <= total; t++) {
      var valeur = parseInt(positionsEquipes[t], 10) || t;
      if (valeur > total) valeur = t;
      htmlEquipes += '<div class="ligne"><span>Équipe ' + t + "</span>" +
        '<select data-position-equipe="' + t + '">' + optionsNombres(total, valeur) + "</select></div>";
    }
    zone.innerHTML = htmlEquipes;
    return;
  }

  if (mode === "coop") {
    zone.innerHTML = '<p class="etiquette">Résultat</p>' +
      '<select id="resultatCoop">' +
      '<option value="1">Victoire</option>' +
      '<option value="0">Défaite</option>' +
      "</select>";
    return;
  }

  if ((jeu.victoire || "classement") === "binaire") {
    zone.innerHTML = '<p class="etiquette">Gagnant</p>' + choisis.map(function (nom) {
      return '<label class="radio"><input type="radio" name="gagnant" value="' + echapper(nom) + '">' +
        echapper(nom) + "</label>";
    }).join("");
    return;
  }

  zone.innerHTML = '<p class="etiquette">Classement de la partie</p>' + choisis.map(function (nom, index) {
    var valeur = parseInt(positionsJoueurs[nom], 10) || index + 1;
    if (valeur > choisis.length) valeur = index + 1;
    return '<div class="ligne"><span class="rang-nom">' + echapper(nom) + "</span>" +
      '<select data-position-joueur="' + echapper(nom) + '">' +
      optionsNombres(choisis.length, valeur) + "</select></div>";
  }).join("");
}

function renderClassement() {
  var zone = document.getElementById("classement");
  var lignes = Object.keys(joueurs).map(function (nom) {
    return { nom: nom, score: Number(joueurs[nom].score) || 0 };
  }).sort(function (a, b) { return b.score - a.score; });

  if (lignes.length === 0) {
    zone.innerHTML = '<p class="vide">Aucun joueur enregistré.</p>';
    return;
  }

  zone.innerHTML = lignes.map(function (ligne, index) {
    return '<div class="rang">' +
      '<span class="pastille' + (index === 0 ? " premier" : "") + '">' + (index + 1) + "</span>" +
      '<span class="rang-nom">' + echapper(ligne.nom) + "</span>" +
      '<span class="score">' + Math.round(ligne.score) + "</span>" +
      "</div>";
  }).join("");
}

function libelleMode(mode) {
  return { competitif: "Compétitif", coop: "Coop", mixte: "Mixte" }[mode] || mode || "—";
}

function formaterDate(valeur) {
  var date = new Date(valeur);
  if (isNaN(date.getTime())) return String(valeur || "");
  return date.toLocaleDateString("fr-CH");
}

function renderHistorique() {
  var zone = document.getElementById("historique");
  if (historique.length === 0) {
    zone.innerHTML = '<p class="vide">Aucune partie enregistrée.</p>';
    return;
  }
  zone.innerHTML = historique.slice().reverse().map(function (partie) {
    var noms = (partie.joueurs || []).join(" · ");
    return '<div class="partie">' +
      '<div class="ligne" style="border:none;padding:0">' +
      "<strong>" + echapper(partie.jeu) + "</strong>" +
      '<span class="meta">' + echapper(formaterDate(partie.date)) + "</span>" +
      "</div>" +
      '<p class="meta">' + echapper(libelleMode(partie.mode)) + " · " + echapper(noms) + "</p>" +
      "</div>";
  }).join("");
}

function renderGestionJoueurs() {
  var zone = document.getElementById("gestionJoueurs");
  var noms = Object.keys(joueurs).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  if (noms.length === 0) {
    zone.innerHTML = '<p class="vide">Aucun joueur enregistré.</p>';
    return;
  }
  zone.innerHTML = noms.map(function (nom) {
    return '<div class="ligne">' +
      '<span class="rang-nom">' + echapper(nom) +
      ' <span class="meta">' + Math.round(Number(joueurs[nom].score) || 0) + "</span></span>" +
      '<span class="petits-boutons">' +
      '<button data-modifier-joueur="' + echapper(nom) + '">Modifier</button>' +
      '<button class="danger" data-supprimer-joueur="' + echapper(nom) + '">Suppr.</button>' +
      "</span></div>";
  }).join("");
}

function renderGestionJeux() {
  var zone = document.getElementById("gestionJeux");
  var noms = Object.keys(jeux).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  if (noms.length === 0) {
    zone.innerHTML = '<p class="vide">Aucun jeu enregistré.</p>';
    return;
  }
  zone.innerHTML = noms.map(function (nom) {
    var jeu = jeux[nom];
    var equipe = { non: "sans équipe", oui: "en équipe", variable: "équipe variable" }[jeu.modeEquipe] || "sans équipe";
    return '<div class="ligne">' +
      '<span class="rang-nom">' + echapper(nom) +
      ' <span class="meta">C' + echapper(jeu.complexite) + " · " + echapper(jeu.duree) + " min · " +
      echapper(libelleMode(jeu.mode)) + " · " + echapper(equipe) + "</span></span>" +
      '<span class="petits-boutons">' +
      '<button data-modifier-jeu="' + echapper(nom) + '">Modifier</button>' +
      '<button class="danger" data-supprimer-jeu="' + echapper(nom) + '">Suppr.</button>' +
      "</span></div>";
  }).join("");
}

function renderAll() {
  renderJeuSelect();
  onJeuChange();
  renderClassement();
  renderHistorique();
  renderGestionJoueurs();
  renderGestionJeux();
}

/* ============================================================
   CHANGEMENTS DANS L'INTERFACE
============================================================ */
function onJeuChange() {
  var jeu = jeuActif();
  var modeContainer = document.getElementById("modeContainer");
  var modeSelect = document.getElementById("mode");
  var teamModeContainer = document.getElementById("teamModeContainer");
  var teamModeSelect = document.getElementById("teamModeSelect");
  var teamCountContainer = document.getElementById("teamCountContainer");

  if (!jeu) {
    modeContainer.classList.add("hidden");
    teamModeContainer.classList.add("hidden");
    teamCountContainer.classList.add("hidden");
    renderJoueurs();
    updateClassementInputs();
    return;
  }

  if (!jeu.modeEquipe) jeu.modeEquipe = "non";

  if (jeu.mode === "mixte") {
    modeContainer.classList.remove("hidden");
  } else {
    modeContainer.classList.add("hidden");
    modeSelect.value = jeu.mode;
  }

  if (jeu.modeEquipe === "oui") {
    teamModeContainer.classList.add("hidden");
    teamModeSelect.value = "oui";
    teamCountContainer.classList.remove("hidden");
  } else if (jeu.modeEquipe === "non") {
    teamModeContainer.classList.add("hidden");
    teamModeSelect.value = "non";
    teamCountContainer.classList.add("hidden");
  } else {
    teamModeContainer.classList.remove("hidden");
    teamCountContainer.classList.toggle("hidden", teamModeSelect.value !== "oui");
  }

  renderJoueurs();
  updateClassementInputs();
}

function onTeamModeChange() {
  var valeur = document.getElementById("teamModeSelect").value;
  document.getElementById("teamCountContainer").classList.toggle("hidden", valeur !== "oui");
  renderJoueurs();
  updateClassementInputs();
}

function surClicJoueur(evenement) {
  var cible = evenement.target;
  if (cible.classList && cible.classList.contains("player-name")) {
    basculerSelection(cible.getAttribute("data-cocher"));
  }
}

function surChangementJoueur(evenement) {
  var cible = evenement.target;
  if (cible.matches && cible.matches('input[type="checkbox"]')) {
    basculerSelection(cible.getAttribute("data-cocher"), cible.checked);
    return;
  }
  if (cible.matches && cible.matches("select.teamSelect")) {
    var nom = cible.getAttribute("data-equipe");
    equipes[nom] = parseInt(cible.value, 10) || 1;
    updateClassementInputs();
  }
}

function basculerSelection(nom, force) {
  if (!nom) return;
  var actif = force === undefined ? selection[nom] !== true : force;
  if (actif) {
    selection[nom] = true;
    if (!equipes[nom]) equipes[nom] = 1;
  } else {
    delete selection[nom];
  }
  renderJoueurs();
  updateClassementInputs();
}

function surChangementClassement(evenement) {
  var cible = evenement.target;
  if (cible.matches && cible.matches("select[data-position-equipe]")) {
    positionsEquipes[cible.getAttribute("data-position-equipe")] = parseInt(cible.value, 10) || 1;
    return;
  }
  if (cible.matches && cible.matches("select[data-position-joueur]")) {
    positionsJoueurs[cible.getAttribute("data-position-joueur")] = parseInt(cible.value, 10) || 1;
  }
}

/* ============================================================
   JEUX : FORMULAIRE
============================================================ */
function onModeChangeNewGame() {
  var mode = document.getElementById("newGameMode").value;
  document.getElementById("victoryTypeContainer").classList.toggle("hidden", mode === "coop");
}

function reinitialiserFormJeu() {
  jeuEnEdition = null;
  document.getElementById("newGameName").value = "";
  document.getElementById("newGameComplexity").value = "2.5";
  document.getElementById("newGameDuration").value = "45";
  document.getElementById("newGameMode").value = "competitif";
  document.getElementById("newGameVictoryType").value = "classement";
  document.getElementById("newGameVariableDuration").value = "non";
  document.getElementById("newGameTeamMode").value = "non";
  document.getElementById("titreFormJeu").textContent = "Ajouter un jeu";
  document.getElementById("btnEnregistrerJeu").textContent = "Ajouter le jeu";
  document.getElementById("btnAnnulerJeu").classList.add("hidden");
  onModeChangeNewGame();
}

function editerJeu(nom) {
  var jeu = jeux[nom];
  if (!jeu) return;
  jeuEnEdition = nom;
  document.getElementById("newGameName").value = nom;
  document.getElementById("newGameComplexity").value = jeu.complexite;
  document.getElementById("newGameDuration").value = jeu.duree;
  document.getElementById("newGameMode").value = jeu.mode;
  document.getElementById("newGameVictoryType").value = jeu.victoire || "classement";
  document.getElementById("newGameVariableDuration").value = jeu.variable || "non";
  document.getElementById("newGameTeamMode").value = jeu.modeEquipe || "non";
  document.getElementById("titreFormJeu").textContent = "Modifier « " + nom + " »";
  document.getElementById("btnEnregistrerJeu").textContent = "Enregistrer";
  document.getElementById("btnAnnulerJeu").classList.remove("hidden");
  onModeChangeNewGame();
  document.getElementById("newGameName").focus();
}

function annulerEditionJeu() {
  reinitialiserFormJeu();
}

function enregistrerJeu() {
  var nom = document.getElementById("newGameName").value.trim();
  var complexite = parseFloat(document.getElementById("newGameComplexity").value);
  var duree = parseFloat(document.getElementById("newGameDuration").value);
  var mode = document.getElementById("newGameMode").value;
  var victoire = document.getElementById("newGameVictoryType").value;
  var variable = document.getElementById("newGameVariableDuration").value;
  var modeEquipe = document.getElementById("newGameTeamMode").value;

  if (!nom) { alert("Donne un nom au jeu."); return; }
  if (!isFinite(complexite) || complexite <= 0) { alert("Complexité invalide (ex. 2.5)."); return; }
  if (!isFinite(duree) || duree <= 0) { alert("Durée invalide (en minutes)."); return; }
  if ((!jeuEnEdition || jeuEnEdition !== nom) && jeux[nom]) { alert("Ce jeu existe déjà."); return; }

  if (jeuEnEdition && jeuEnEdition !== nom) delete jeux[jeuEnEdition];

  jeux[nom] = {
    complexite: complexite,
    duree: duree,
    mode: mode,
    victoire: mode === "coop" ? "binaire" : victoire,
    variable: variable,
    modeEquipe: modeEquipe
  };

  sauverTout();
  reinitialiserFormJeu();
  renderAll();
  selection = {};
  renderJoueurs();
  updateClassementInputs();
  afficherStatut("Jeu enregistré ✓");
}

function supprimerJeu(nom) {
  if (!confirm("Supprimer le jeu « " + nom + " » ?")) return;
  delete jeux[nom];
  sauverTout();
  renderAll();
}

function surClicGestionJeux(evenement) {
  var cible = evenement.target;
  if (!cible.getAttribute) return;
  var aModifier = cible.getAttribute("data-modifier-jeu");
  var aSupprimer = cible.getAttribute("data-supprimer-jeu");
  if (aModifier) editerJeu(aModifier);
  if (aSupprimer) supprimerJeu(aSupprimer);
}

/* ============================================================
   JOUEURS : AJOUT / MODIF
============================================================ */
function ajouterJoueur() {
  var champ = document.getElementById("newPlayer");
  var nom = champ.value.trim();
  if (!nom) { alert("Écris un nom."); return; }
  if (joueurs[nom]) { alert("Ce joueur existe déjà."); return; }
  joueurs[nom] = { score: START_SCORE, debut: null };
  champ.value = "";
  sauverTout();
  renderJoueurs();
  renderClassement();
  renderGestionJoueurs();
}

function supprimerJoueur(nom) {
  if (!confirm("Supprimer le joueur « " + nom + " » ?")) return;
  delete joueurs[nom];
  delete selection[nom];
  delete equipes[nom];
  sauverTout();
  renderJoueurs();
  renderClassement();
  renderGestionJoueurs();
  updateClassementInputs();
}

function modifierJoueur(nom) {
  var nouveauNom = prompt("Nom :", nom);
  if (nouveauNom === null) return;
  var nomFinal = nouveauNom.trim();
  if (!nomFinal) { alert("Le nom ne peut pas être vide."); return; }
  if (nomFinal !== nom && joueurs[nomFinal]) { alert("Ce nom est déjà pris."); return; }

  var scoreSaisi = prompt("Score :", String(Math.round(Number(joueurs[nom].score) || START_SCORE)));
  if (scoreSaisi === null) return;
  var score = parseFloat(scoreSaisi);
  if (!isFinite(score)) { alert("Score invalide."); return; }

  var ancien = joueurs[nom];
  delete joueurs[nom];
  joueurs[nomFinal] = { score: score, debut: ancien.debut || null };

  if (selection[nom]) { delete selection[nom]; selection[nomFinal] = true; }
  if (equipes[nom]) { equipes[nomFinal] = equipes[nom]; delete equipes[nom]; }
  if (positionsJoueurs[nom] !== undefined) {
    positionsJoueurs[nomFinal] = positionsJoueurs[nom];
    delete positionsJoueurs[nom];
  }

  sauverTout();
  renderJoueurs();
  renderClassement();
  renderGestionJoueurs();
  updateClassementInputs();
}

function surClicGestionJoueurs(evenement) {
  var cible = evenement.target;
  if (!cible.getAttribute) return;
  var aModifier = cible.getAttribute("data-modifier-joueur");
  var aSupprimer = cible.getAttribute("data-supprimer-joueur");
  if (aModifier) modifierJoueur(aModifier);
  if (aSupprimer) supprimerJoueur(aSupprimer);
}

/* ============================================================
   CALCUL ELO
============================================================ */
function scoreDe(nom) {
  var joueur = joueurs[nom];
  return joueur && joueur.score !== undefined ? Number(joueur.score) : START_SCORE;
}

function probabilite(rating, adversaire) {
  return 1 / (1 + Math.pow(10, (adversaire - rating) / 400));
}

function borner(delta) {
  return Math.max(-50, Math.min(50, delta));
}

function multiplicateur(jeu, nombreJoueurs) {
  var complexite = 1 + ((Number(jeu.complexite) || 2.5) - 2.5) * 0.3;
  var effectif = 1 + (nombreJoueurs - 2) * 0.1;
  var base = Number(jeu.duree) || 0;
  var duree = jeu.variable === "oui" ? base * nombreJoueurs : base;
  var facteurDuree = duree < 30 ? 0.9 : (duree <= 90 ? 1 : 1.15);
  return Math.min(2, Math.max(0.6, complexite * effectif * facteurDuree));
}

function deltasSolo(resultats, jeu, mode, difficulte, soiree) {
  var nombre = resultats.length;
  var mult = multiplicateur(jeu, nombre);
  var facteurDifficulte = mode === "coop" ? difficulte : 1;
  var deltas = {};

  resultats.forEach(function (resultat) {
    var rating = scoreDe(resultat.nom);
    var score;
    if (resultat.scoreFixe !== undefined) {
      score = resultat.scoreFixe;
    } else if (nombre === 1) {
      score = 1;
    } else {
      score = (nombre - resultat.position) / (nombre - 1);
    }

    var attendu = 0;
    resultats.forEach(function (autre) {
      if (autre.nom !== resultat.nom) attendu += probabilite(rating, scoreDe(autre.nom));
    });
    if (nombre > 1) attendu = attendu / (nombre - 1);

    var delta = K_FACTOR * mult * facteurDifficulte * (score - attendu);

    if (mode === "coop") {
      if (!coopGains[soiree]) coopGains[soiree] = {};
      var cumul = coopGains[soiree][resultat.nom] || 0;
      var applique = Math.min(COOP_CAP - cumul, Math.max(-COOP_CAP, delta * 0.5));
      coopGains[soiree][resultat.nom] = cumul + applique;
      delta = applique;
    }

    deltas[resultat.nom] = borner(delta);
  });

  return deltas;
}

function deltasEquipe(resultats, jeu, difficulte) {
  var mult = multiplicateur(jeu, resultats.length);
  var groupes = {};

  resultats.forEach(function (resultat) {
    var cle = String(resultat.equipe);
    if (!groupes[cle]) groupes[cle] = [];
    groupes[cle].push(resultat);
  });

  var equipesUtilisees = Object.keys(groupes);
  var rating = {};
  equipesUtilisees.forEach(function (equipe) {
    var total = 0;
    groupes[equipe].forEach(function (resultat) { total += scoreDe(resultat.nom); });
    rating[equipe] = total / groupes[equipe].length;
  });

  function positionDe(equipe) {
    var valeur = parseInt(groupes[equipe][0].position, 10);
    return isFinite(valeur) ? valeur : 1;
  }

  function resultatDe(equipe) {
    if (equipesUtilisees.length === 1) return 1;
    var points = 0;
    equipesUtilisees.forEach(function (autre) {
      if (autre === equipe) return;
      var maPosition = positionDe(equipe);
      var saPosition = positionDe(autre);
      points += maPosition < saPosition ? 1 : (maPosition === saPosition ? 0.5 : 0);
    });
    return points / (equipesUtilisees.length - 1);
  }

  var deltas = {};
  equipesUtilisees.forEach(function (equipe) {
    var attendu = 0;
    equipesUtilisees.forEach(function (autre) {
      if (autre !== equipe) attendu += probabilite(rating[equipe], rating[autre]);
    });
    if (equipesUtilisees.length > 1) attendu = attendu / (equipesUtilisees.length - 1);

    var delta = borner(K_FACTOR * mult * difficulte * (resultatDe(equipe) - attendu));
    groupes[equipe].forEach(function (resultat) { deltas[resultat.nom] = delta; });
  });

  return deltas;
}

function regressionVersBase() {
  var sessions = {};

  historique.forEach(function (partie) {
    var moment = new Date(partie.date).getTime();
    (partie.joueurs || []).forEach(function (nom) {
      var joueur = joueurs[nom];
      if (!joueur || !joueur.debut) return;
      if (moment < new Date(joueur.debut).getTime()) return;
      if (!sessions[nom]) sessions[nom] = {};
      sessions[nom][partie.id || moment] = true;
    });
  });

  var actifs = Object.keys(joueurs).filter(function (nom) { return joueurs[nom].debut; });
  if (actifs.length === 0) return;

  var total = 0;
  actifs.forEach(function (nom) {
    total += sessions[nom] ? Object.keys(sessions[nom]).length : 0;
  });
  var moyenne = total / actifs.length;
  if (!moyenne) return;

  actifs.forEach(function (nom) {
    var nombre = sessions[nom] ? Object.keys(sessions[nom]).length : 0;
    var ratio = nombre / moyenne;
    var score = Number(joueurs[nom].score) || START_SCORE;
    if (ratio < 0.5 || (ratio > 1.5 && score < START_SCORE)) {
      joueurs[nom].score = score + (START_SCORE - score) * REGRESSION_RATE;
    }
  });
}

/* ============================================================
   VALIDATION D'UNE PARTIE
============================================================ */
function construireResultats(choisis, enEquipe) {
  var resultats = [];

  if (enEquipe) {
    var parEquipe = {};
    var champsEquipe = document.querySelectorAll("select[data-position-equipe]");
    Array.prototype.forEach.call(champsEquipe, function (champ) {
      parEquipe[champ.getAttribute("data-position-equipe")] = parseInt(champ.value, 10) || 1;
    });
    choisis.forEach(function (nom) {
      var equipe = parseInt(equipes[nom], 10) || 1;
      resultats.push({
        nom: nom,
        equipe: equipe,
        position: parEquipe[String(equipe)] || equipe
      });
    });
    return resultats;
  }

  if (modeReel() === "coop") {
    var champResultat = document.getElementById("resultatCoop");
    var valeur = champResultat ? parseInt(champResultat.value, 10) || 0 : 0;
    choisis.forEach(function (nom) { resultats.push({ nom: nom, scoreFixe: valeur }); });
    return resultats;
  }

  if ((jeuActif() && jeuActif().victoire || "classement") === "binaire") {
    var gagnant = document.querySelector('input[name="gagnant"]:checked');
    if (!gagnant) return null;
    choisis.forEach(function (nom) {
      resultats.push({ nom: nom, scoreFixe: nom === gagnant.value ? 1 : 0 });
    });
    return resultats;
  }

  var champsPosition = document.querySelectorAll("select[data-position-joueur]");
  Array.prototype.forEach.call(champsPosition, function (champ) {
    resultats.push({
      nom: champ.getAttribute("data-position-joueur"),
      position: parseInt(champ.value, 10) || 1
    });
  });
  return resultats;
}

function validerPartie() {
  var jeu = jeuActif();
  if (!jeu) { alert("Choisis d'abord un jeu."); return; }

  var choisis = joueursChoisis();
  if (choisis.length === 0) { alert("Coche au moins un joueur."); return; }

  var enEquipe = equipeActive(jeu) === "oui";
  if (enEquipe) {
    var utilisees = {};
    choisis.forEach(function (nom) { utilisees[parseInt(equipes[nom], 10) || 1] = true; });
    if (Object.keys(utilisees).length < 2) {
      alert("Mets les joueurs dans au moins deux équipes.");
      return;
    }
  }

  var resultats = construireResultats(choisis, enEquipe);
  if (resultats === null) { alert("Choisis un gagnant."); return; }

  enregistrerPartie(resultats, jeu, enEquipe);
}

function enregistrerPartie(resultats, jeu, enEquipe) {
  var mode = modeReel();
  var difficulte = 1;
  if (mode === "coop") {
    var champDifficulte = document.getElementById("coopDifficulty");
    difficulte = champDifficulte ? parseFloat(champDifficulte.value) || 1 : 1;
  }

  var aujourdhui = new Date().toISOString().slice(0, 10);
  var soiree = new Date().toDateString();

  var deltas = enEquipe
    ? deltasEquipe(resultats, jeu, mode === "coop" ? difficulte : 1)
    : deltasSolo(resultats, jeu, mode, difficulte, soiree);

  resultats.forEach(function (resultat) {
    var joueur = joueurs[resultat.nom];
    if (!joueur) return;
    if (!joueur.debut) joueur.debut = aujourdhui;
    joueur.score = (joueur.score === undefined ? START_SCORE : Number(joueur.score)) + (deltas[resultat.nom] || 0);
  });

  historique.push({
    id: Date.now(),
    date: aujourdhui,
    jeu: nomJeuActif(),
    mode: mode,
    joueurs: resultats.map(function (resultat) { return resultat.nom; }),
    resultat: resultats
  });

  regressionVersBase();
  sauverTout();

  var gains = resultats.map(function (resultat) {
    var delta = Math.round(deltas[resultat.nom] || 0);
    return resultat.nom + " " + (delta >= 0 ? "+" : "") + delta;
  }).join(" · ");

  selection = {};
  equipes = {};
  positionsJoueurs = {};
  positionsEquipes = {};

  renderJoueurs();
  updateClassementInputs();
  renderClassement();
  renderHistorique();
  afficherStatut("Partie enregistrée ✓  " + gains);
}

/* ============================================================
   IMPORT / EXPORT / RESET
============================================================ */
function exporterDonnees() {
  var contenu = JSON.stringify({ jeux: jeux, joueurs: joueurs, historique: historique }, null, 2);
  var blob = new Blob([contenu], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var lien = document.createElement("a");
  lien.href = url;
  lien.download = "classement_backup.json";
  lien.click();
  URL.revokeObjectURL(url);
}

function importerDonnees(evenement) {
  var champ = evenement.target;
  var fichier = champ.files && champ.files[0];
  if (!fichier) return;

  var lecteur = new FileReader();
  lecteur.onload = function (charge) {
    try {
      var donnees = JSON.parse(charge.target.result);
      if (!donnees.joueurs || !donnees.jeux || !Array.isArray(donnees.historique)) {
        throw new Error("format");
      }
      jeux = donnees.jeux;
      joueurs = donnees.joueurs;
      historique = donnees.historique;
      selection = {};
      equipes = {};
      positionsJoueurs = {};
      positionsEquipes = {};
      sauverTout();
      renderAll();
      afficherStatut("Import réussi ✓");
    } catch (erreur) {
      alert("Fichier invalide.");
    }
    champ.value = "";
  };
  lecteur.readAsText(fichier);
}

function reset() {
  if (!confirm("Effacer tous les joueurs, tous les jeux et tout l'historique ?")) return;

  jeux = {};
  joueurs = {};
  historique = [];
  coopGains = {};
  selection = {};
  equipes = {};
  positionsJoueurs = {};
  positionsEquipes = {};
  jeuEnEdition = null;

  try {
    localStorage.removeItem("jeux");
    localStorage.removeItem("joueurs");
    localStorage.removeItem("historique");
    localStorage.removeItem("backup_auto");
  } catch (erreur) {
    /* stockage indisponible */
  }

  reinitialiserFormJeu();
  renderAll();
  afficherStatut("Tout a été effacé.");
}

/* ============================================================
   DÉMARRAGE
============================================================ */
function init() {
  var liste = document.getElementById("joueursList");
  liste.addEventListener("click", surClicJoueur);
  liste.addEventListener("change", surChangementJoueur);
  document.getElementById("classementInputs").addEventListener("change", surChangementClassement);
  document.getElementById("gestionJoueurs").addEventListener("click", surClicGestionJoueurs);
  document.getElementById("gestionJeux").addEventListener("click", surClicGestionJeux);

  renderAll();
  onModeChangeNewGame();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
